[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ata-audit"
version = "0.1.0"
description = "Audit utilities and frozen records for temporal adaptation decisions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.8,<4",
  "datasets>=2.20,<4",
  "transformers>=4.44,<5",
  "peft>=0.12,<1",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
